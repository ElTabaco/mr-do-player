services:
    mr-do-upnp:
        image: riemerk/mr-do-upnp-c:latest
        container_name: mr-do-upnp-c
        environment:
            - TZ=Europe/Berlin
            - UPNP_NAME=mrUPnP
        network_mode: host
        volumes:
        - ./etc/asound.conf:/etc/asound.conf
        - ./tmp/music/:/tmp/music
        depends_on:
            init-fifo:
                condition: service_completed_successfully
        restart: unless-stopped

    init-fifo:
        image: busybox:1.36
        container_name: mr-do-fifo
        command: ["sh", "-c", "umask 0 && rm -f /tmp/music/upnpfifo /tmp/music/spotifyfifo && mkfifo -m 0666 /tmp/music/upnpfifo /tmp/music/spotifyfifo"]
        volumes:
        - ./tmp/music:/tmp/music
        restart: "no"

    # Downloads the Spotify Soloist binary into ./config/soloist/bin (not in any image, Spotify
    # forbids redistribution) and checks for a newer build once a day
    mr-do-soloist-fetch:
        image: riemerk/mr-do-soloist:latest-fetch
        container_name: mr-do-soloist-fetch
        user: "1000:1000"
        environment:
            - TZ=Europe/Berlin
            - SOLOIST_UPDATE_INTERVAL=86400
        read_only: true
        tmpfs:
            - /tmp
        volumes:
            - ./config/soloist/:/data
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/soloist-fetch.ready"]
            interval: 30s
            timeout: 5s
            start_period: 300s
            start_interval: 2s
        restart: unless-stopped

    # Spotify Connect: Spotify Soloist -> PulseAudio pipe sink -> /tmp/music/spotifyfifo
    # SOLOIST_API_KEY from ./.env (https://developer.spotify.com/dashboard/soloist), never commit it
    mr-do-soloist:
        image: riemerk/mr-do-soloist:latest
        container_name: mr-do-soloist
        user: "1000:1000"
        environment:
            - TZ=Europe/Berlin
            - SOLOIST_DEVICE_NAME=mrSpot
            - SAMPLE_RATE=44100
            - SOLOIST_API_KEY=${SOLOIST_API_KEY:?set SOLOIST_API_KEY in .env}
        network_mode: host
        read_only: true
        tmpfs:
            - /run/soloist
            - /cache
        volumes:
            - ./config/soloist/:/data
            - ./tmp/music/:/tmp/music
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh"]
            interval: 30s
            timeout: 5s
            start_period: 60s
        depends_on:
            init-fifo:
                condition: service_completed_successfully
            # the Soloist binary must be downloaded first
            mr-do-soloist-fetch:
                condition: service_healthy
        restart: unless-stopped

    mr-do-snapserver:
        image: riemerk/mr-do-snapserver:latest
        container_name: mr-do-snapserver
        environment:
            - TZ=Europe/Berlin
        volumes:
            - ./etc/snapserver.conf:/etc/snapserver.conf
            - ./config/snapserver/:/root/.config/snapserver/
            - ./tmp/music/:/tmp/music
        network_mode: host
        depends_on:
            init-fifo:
                condition: service_completed_successfully
            # PulseAudio must hold the Spotify FIFO open before snapserver reads it
            mr-do-soloist:
                condition: service_healthy
        restart: unless-stopped

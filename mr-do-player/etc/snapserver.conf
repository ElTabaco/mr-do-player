[server]
# No avahi-daemon in the container or on the node. Spotify Connect discovery is
# done by the mr-do-soloist sidecar (Soloist's own mDNS), not by snapserver.
mdns_enabled = false

[http]
doc_root = /usr/share/snapserver/snapweb

[tcp]

[stream]
stream = pipe:///tmp/music/upnpfifo?name=upnp&sampleformat=48000:16:2
# Spotify Connect: mr-do-soloist sidecar (Soloist -> PulseAudio pipe sink) writes s16le 48 kHz stereo.
# mode=read: the FIFO is created by the init-fifo init container.
# idle_threshold=2000: PulseAudio writes digital silence when idle; after 2 s of it the stream
# is idle and the mrMusic meta stream switches to upnp (short gaps between tracks do not).
source = pipe:///tmp/music/spotifyfifo?name=mrSpot&sampleformat=48000:16:2&mode=read&idle_threshold=2000
source = meta:///mrSpot/upnp?name=mrMusic
sampleformat = 48000:16:2
codec = flac

[logging]

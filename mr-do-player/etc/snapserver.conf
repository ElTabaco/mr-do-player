[server]
# No avahi-daemon in the container or on the node.
mdns_enabled = false

[http]
doc_root = /usr/share/snapserver/snapweb

[tcp]

[stream]
# 44.1 kHz: most music files are 44.1 kHz, so ALSA (UPnP) does not resample them.
# Clients resample only if their DAC lacks 44.1 kHz.
stream = pipe:///tmp/music/upnpfifo?name=upnp&sampleformat=44100:16:2
sampleformat = 44100:16:2
codec = flac
# end-to-end buffer; 1500 ms (default 1000) rides out Wi-Fi hiccups on the clients
buffer = 1500

[logging]

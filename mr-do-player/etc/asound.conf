pcm.!default {
    type plug
    slave.pcm rate44100Hz
}

# 44.1 kHz = snapserver's sample format. gmediarender (mr-do-upnp-c) already delivers
# S16_LE at SAMPLE_RATE=44100: files at other rates are resampled by GStreamer
# audioresample (windowed sinc, RESAMPLE_QUALITY), so this plugin only passes samples through.
pcm.rate44100Hz {
    type rate
    slave {
        pcm writeFile # Direct to the plugin which will write to a file
        format S16_LE
        rate 44100
    }
}

pcm.writeFile {
    type file
    slave.pcm null
    file "/tmp/music/upnpfifo"
    format "raw"
}

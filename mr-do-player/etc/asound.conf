pcm.!default {
    type plug
    slave.pcm rate44100Hz
}

# 44.1 kHz = snapserver's sample format: CD-quality files (44.1 kHz, most music)
# pass through unresampled. Other rates use ALSA's built-in linear converter
# (the image has no alsa-plugins resamplers).
pcm.rate44100Hz {
    type rate
    slave {
        pcm writeFile # Direct to the plugin which will write to a file
        format S16_LE
        rate 44100
    }
}

pcm.writeFile {
    type file
    slave.pcm null
    file "/tmp/music/upnpfifo"
    format "raw"
}

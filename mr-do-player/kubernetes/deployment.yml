apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mr-do-player
  name: mr-do-player
  labels:
    app.kubernetes.io/name: mr-do-player
    app.kubernetes.io/component: player
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mr-do-player
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mr-do-player
        app.kubernetes.io/component: player
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        cputype: amd64
      # hostNetwork MUST stay: Soloist (Spotify Connect) and UPnP/DLNA
      # discover peers via mDNS multicast (5353/UDP) and SSDP (1900/UDP).
      # MetalLB L2 DNATs unicast to the LB IP (192.168.0.20) but cannot
      # forward multicast. With hostNetwork the pod binds directly on the
      # node's LAN interface, so Spotify phones/clients can find it.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Create the named pipes before any container opens them. snapserver reads both:
        #   upnpfifo    <- gmediarender (ALSA file plugin)
        #   spotifyfifo <- mr-do-soloist (PulseAudio module-pipe-sink)
        - name: init-fifo
          image: busybox:1.36
          command: ["sh", "-c", "umask 0 && rm -f /tmp/music/upnpfifo /tmp/music/spotifyfifo && mkfifo -m 0666 /tmp/music/upnpfifo /tmp/music/spotifyfifo"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: shared-data
              mountPath: /tmp/music
        # Spotify Connect: Spotify Soloist -> PulseAudio pipe sink -> /tmp/music/spotifyfifo.
        # Native sidecar (restartPolicy: Always): the main containers start only after its
        # startupProbe passes, i.e. PulseAudio already holds the FIFO open, so snapserver
        # never reads EOF on the Spotify stream. The Soloist binary is downloaded from
        # Spotify's CDN at start and cached with the login in the NFS volume (subPath soloist).
        - name: mr-do-soloist
          image: riemerk/mr-do-soloist:17.0-b7022ab
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          env:
            - name: TZ
              value: Europe/Berlin
            - name: SOLOIST_DEVICE_NAME
              value: mrSpot
            - name: SOLOIST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mr-do-soloist
                  key: SOLOIST_API_KEY
            - name: SOLOIST_CACHE_SIZE_MB
              value: "300"
            - name: SOLOIST_INITIAL_VOLUME
              value: "100"
            # PulseAudio resamples Spotify's 44.1 kHz to 48 kHz = snapserver's stream format
            - name: SAMPLE_RATE
              value: "48000"
          # The startup probe waits inside the probe (up to 8 s) instead of failing while
          # the Soloist binary is still downloading; each failed attempt would otherwise
          # create an "Unhealthy" Warning event. Keep periodSeconds short: the kubelet's
          # first probe finds the container not yet running and then waits one full period.
          # Total budget: 36 x 10 s = 6 min.
          startupProbe:
            exec:
              command: ["sh", "-c", "for i in $(seq 1 16); do /usr/local/bin/healthcheck.sh >/dev/null 2>&1 && exit 0; sleep 0.5; done; /usr/local/bin/healthcheck.sh"]
            periodSeconds: 10
            timeoutSeconds: 9
            failureThreshold: 36
          livenessProbe:
            exec:
              command: ["/usr/local/bin/healthcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Soloist binary + stored Spotify Connect session (NFS, persistent)
            - name: player-data
              mountPath: /data
              subPath: soloist
            - name: soloist-cache
              mountPath: /cache
            - name: soloist-run
              mountPath: /run/soloist
            - name: shared-data
              mountPath: /tmp/music
      containers:
        - name: mr-do-upnp
          # gmediarender UPnP/DLNA MediaRenderer (310MB, replaces 659MB Kodi).
          # Purpose-built headless renderer — no X11, no GL, no skin.
          image: riemerk/mr-do-upnp-c:1.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 49494
              name: upnp-http
            - containerPort: 1900
              name: upnp-ssdp
              protocol: UDP
          env:
            - name: TZ
              value: Europe/Berlin
            - name: UPNP_NAME
              value: mrCast
          # gmediarender boots in ~2s and binds port 49494 reliably.
          startupProbe:
            tcpSocket:
              port: upnp-http
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: upnp-http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: upnp-http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            # gmediarender is lightweight (no X11/GL like Kodi).
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: asound-config
              mountPath: /etc/asound.conf
              subPath: asound.conf
              readOnly: true
            - name: shared-data
              mountPath: /tmp/music
            - name: tmp
              mountPath: /tmp
        - name: mr-do-snapserver
          image: riemerk/mr-do-snapserver:0.35.0-4fed179
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1780
              name: webinterface
            - containerPort: 1704
              name: snapcast-stream
            - containerPort: 1705
              name: snapcast-ctrl
          env:
            - name: TZ
              value: Europe/Berlin
            # snapserver uses $HOME/.config/snapserver for persistent settings.
            # With runAsUser 1000 we point HOME at /home/snapserver so the
            # volume mount can create the directory.
            - name: HOME
              value: /home/snapserver
          # Probe the HTTP port (1780), not the TCP control port (1705): a bare TCP
          # connect/close on 1705 makes snapserver log
          # "[Error] (ControlSessionTCP) Error while reading from control socket".
          startupProbe:
            tcpSocket:
              port: 1780
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1780
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 1780
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Requires /srv/nfs4/homes/mr/media/snapserver/ to exist on NFS
            - name: player-data
              mountPath: /home/snapserver/.config/snapserver
              subPath: snapserver
            - name: snapserver-config
              mountPath: /etc/snapserver.conf
              subPath: snapserver.conf
              readOnly: true
            - name: shared-data
              mountPath: /tmp/music
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: soloist-cache
          emptyDir:
            sizeLimit: 512Mi
        - name: soloist-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: player-data
          persistentVolumeClaim:
            claimName: mr-do-player-pvc-data
        - name: asound-config
          configMap:
            name: mr-do-asound-cfgmap
        - name: snapserver-config
          configMap:
            name: mr-do-snapserver-cfgmap

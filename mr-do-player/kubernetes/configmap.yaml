apiVersion: v1
kind: ConfigMap
metadata:
  name: mr-do-asound-cfgmap
  namespace: mr-do-player
  labels:
    app.kubernetes.io/name: mr-do-player
    app.kubernetes.io/component: upnp
data:
  asound.conf: |
    pcm.!default {
        type plug
        slave.pcm rate44100Hz
    }

    # 44.1 kHz = snapserver's sample format. gmediarender (mr-do-upnp-c) already delivers
    # S16_LE at SAMPLE_RATE=44100: files at other rates are resampled by GStreamer
    # audioresample (windowed sinc, RESAMPLE_QUALITY), so this plugin only passes samples through.
    pcm.rate44100Hz {
        type rate
        slave {
            pcm writeFile # Direct to the plugin which will write to a file
            format S16_LE
            rate 44100
        }
    }

    pcm.writeFile {
        type file
        slave.pcm null
        file "/tmp/music/upnpfifo"
        format "raw"
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mr-do-snapserver-cfgmap
  namespace: mr-do-player
  labels:
    app.kubernetes.io/name: mr-do-player
    app.kubernetes.io/component: snapserver
data:
  snapserver.conf: |
    [server]
    # No avahi-daemon in the container or on the node.
    mdns_enabled = false

    [http]
    doc_root = /usr/share/snapserver/snapweb

    [tcp]

    [stream]
    # 44.1 kHz: most music files are 44.1 kHz, so ALSA (UPnP) does not resample them.
    # Clients resample only if their DAC lacks 44.1 kHz.
    stream = pipe:///tmp/music/upnpfifo?name=upnp&sampleformat=44100:16:2
    sampleformat = 44100:16:2
    codec = flac
    # end-to-end buffer; 1500 ms (default 1000) rides out Wi-Fi hiccups on the clients
    buffer = 1500

    [logging]

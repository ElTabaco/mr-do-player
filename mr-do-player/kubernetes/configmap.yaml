apiVersion: v1
kind: ConfigMap
metadata:
  name: mr-do-asound-cfgmap
  namespace: mr-do-player
  labels:
    app.kubernetes.io/name: mr-do-player
    app.kubernetes.io/component: upnp
data:
  asound.conf: |
    pcm.!default {
        type plug
        slave.pcm rate44100Hz
    }

    # 44.1 kHz = snapserver's sample format. gmediarender (mr-do-upnp-c) already delivers
    # S16_LE at SAMPLE_RATE=44100: files at other rates are resampled by GStreamer
    # audioresample (windowed sinc, RESAMPLE_QUALITY), so this plugin only passes samples through.
    pcm.rate44100Hz {
        type rate
        slave {
            pcm writeFile # Direct to the plugin which will write to a file
            format S16_LE
            rate 44100
        }
    }

    pcm.writeFile {
        type file
        slave.pcm null
        file "/tmp/music/upnpfifo"
        format "raw"
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mr-do-snapserver-cfgmap
  namespace: mr-do-player
  labels:
    app.kubernetes.io/name: mr-do-player
    app.kubernetes.io/component: snapserver
data:
  snapserver.conf: |
    [server]
    # No avahi-daemon in the container or on the node. Spotify Connect discovery is
    # done by the mr-do-soloist sidecar (Soloist's own mDNS), not by snapserver.
    mdns_enabled = false

    [http]
    doc_root = /usr/share/snapserver/snapweb

    [tcp]

    [stream]
    # 44.1 kHz: Spotify and most music files are 44.1 kHz, so neither PulseAudio (Spotify)
    # nor ALSA (UPnP) has to resample them. Clients resample only if their DAC lacks 44.1 kHz.
    stream = pipe:///tmp/music/upnpfifo?name=upnp&sampleformat=44100:16:2
    # Spotify Connect: mr-do-soloist sidecar (Soloist -> PulseAudio pipe sink) writes s16le 44.1 kHz stereo (SAMPLE_RATE).
    # mode=read: the FIFO is created by the init-fifo init container.
    # idle_threshold=2000: PulseAudio writes digital silence when idle; after 2 s of it the stream
    # is idle and the mrMusic meta stream switches to upnp (short gaps between tracks do not).
    source = pipe:///tmp/music/spotifyfifo?name=mrSpot&sampleformat=44100:16:2&mode=read&idle_threshold=2000
    source = meta:///mrSpot/upnp?name=mrMusic
    sampleformat = 44100:16:2
    codec = flac
    # end-to-end buffer; 1500 ms (default 1000) rides out Wi-Fi hiccups on the clients
    buffer = 1500

    [logging]
